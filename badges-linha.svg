<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 970">
  <!--
    Sistema de badges (versao linha, monocromatica)
    Traco fino preto, sem preenchimento. Ideal para impressao, carimbo, laser ou UI minimal.
    Uso: <svg><use href="badges-linha.svg#badge-semaforo" width="120" height="120"/>
  <text x="215" y="510" text-anchor="middle" font-size="13">Versoes bloqueadas</text>
  <use href="#badge-creator-locked" x="10" y="530" width="120" height="120"/>
  <use href="#badge-creator-construtor-locked" x="150" y="530" width="120" height="120"/>
  <use href="#badge-construtor-3d-locked" x="290" y="530" width="120" height="120"/>
  <use href="#badge-plataforma-some-locked" x="10" y="660" width="120" height="120"/>
  <use href="#badge-porta-automatica-locked" x="150" y="660" width="120" height="120"/>
  <use href="#badge-moeda-magica-locked" x="290" y="660" width="120" height="120"/>
  <use href="#badge-clicker-meta-locked" x="10" y="790" width="120" height="120"/>
  <use href="#badge-semaforo-locked" x="150" y="790" width="120" height="120"/>
  <use href="#badge-jogo-ia-locked" x="290" y="790" width="120" height="120"/>
</svg>
    Estado bloqueado: adicionar class="locked" no elemento <use>
  -->
  <style>
    .locked { opacity: .35; }
    symbol g.s { fill: none; stroke: #111; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    text { font-family: sans-serif; font-size: 11px; fill: #111; }
  </style>

  <symbol id="badge-creator" viewBox="0 0 120 120">
    <g class="s">
      <circle cx="60" cy="60" r="56"/>
      <circle cx="60" cy="60" r="47"/>
      <path d="M60 34 q4.5 20 24 24 q-19.5 4.5 -24 24 q-4.5 -20 -24 -24 q19.5 -4.5 24 -24 z"/>
    </g>
  </symbol>

  <symbol id="badge-creator-construtor" viewBox="0 0 120 120">
    <g class="s">
      <circle cx="60" cy="60" r="56"/>
      <circle cx="60" cy="60" r="47"/>
      <path d="M60 32 L84 46 L84 74 L60 88 L36 74 L36 46 Z"/>
      <path d="M36 46 L60 60 L84 46 M60 60 L60 88"/>
    </g>
  </symbol>

  <symbol id="badge-construtor-3d" viewBox="0 0 120 120">
