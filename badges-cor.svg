    <polygon points="18,60 40,72 40,98 18,86" fill="#F5C4B2"/>
    <polygon points="62,60 40,72 40,98 62,86" fill="#D9502F"/>
    <polygon points="80,48 102,60 80,72 58,60" fill="#FFF1EA"/>
    <polygon points="58,60 80,72 80,98 58,86" fill="#F5C4B2"/>
    <polygon points="102,60 80,72 80,98 102,86" fill="#D9502F"/>
    <polygon points="60,22 82,34 60,46 38,34" fill="#FFF1EA"/>
    <polygon points="38,34 60,46 60,72 38,60" fill="#F5C4B2"/>
    <polygon points="82,34 60,46 60,72 82,60" fill="#D9502F"/>
  </symbol>

