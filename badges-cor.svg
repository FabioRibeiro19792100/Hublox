    <circle cx="60" cy="60" r="56" fill="none" stroke="#E85D3D" stroke-width="3.5"/>
    <circle cx="60" cy="60" r="47" fill="#E85D3D"/>
    <polygon points="60,32 84,46 60,60 36,46" fill="#FFF1EA"/>
    <polygon points="36,46 60,60 60,88 36,74" fill="#F5C4B2"/>
    <polygon points="84,46 60,60 60,88 84,74" fill="#D9502F"/>
  </symbol>

